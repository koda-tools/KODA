# Spec delta for the "add-koda-init" capability.
capability: add-koda-init

purpose: Bootstrap the project's .koda folder from the CLI and from a session.

operations:
  - op: add
    id: init-creates-koda-folders
    title: Init creates the .koda folders
    statement: The system SHALL create .koda/commands, .koda/skills and .koda/agents under the workspace root when init runs, and report which were created.
    verify: cd packages/koda && node --conditions=development --import tsx --test test/init.test.ts
    scenarios:
      - when: the user runs `koda init` in a folder with no .koda
        then: the three folders exist and the output lists them as created
      - when: the user runs /init in an interactive session
        then: the same folders are created and the result is written to the transcript

  - op: add
    id: init-is-idempotent
    title: Init never overwrites existing content
    statement: The system SHALL leave existing folders and files untouched when init runs again, and report them as already present.
    verify: cd packages/koda && node --conditions=development --import tsx --test test/init.test.ts
    scenarios:
      - when: init runs in a project that already has .koda/skills with files
        then: the files are unchanged and only the missing folders are created

  - op: add
    id: init-rejects-conflicting-file
    title: Init fails clearly when .koda is a file
    statement: The system SHALL fail with an explanatory error and a non-zero exit code when .koda exists but is not a directory.
    verify: cd packages/koda && node --conditions=development --import tsx --test test/init.test.ts
    scenarios:
      - when: a regular file named .koda exists and the user runs `koda init`
        then: no folder is created and the error names the path

  - op: add
    id: init-needs-no-provider
    title: Init works without a provider key
    statement: The system SHALL run `koda init` without requiring an API key, a network connection or an interactive terminal.
    verify: cd packages/koda && node --conditions=development --import tsx --test test/init.test.ts
    scenarios:
      - when: no provider credentials are configured
        then: "`koda init` still creates the folders and exits with code 0"

  - op: add
    id: init-listed-in-help
    title: /init is discoverable
    statement: The system SHALL list /init in the /help output and in the slash-command suggestions.
    verify: cd packages/core && node --conditions=development --import tsx --test test/commands.test.ts
    scenarios:
      - when: the user types /help or starts typing /in
        then: /init is shown
