# Spec delta for the "suppress-spinner-during-confirmation" capability.
capability: suppress-spinner-during-confirmation
purpose: Garantir que, enquanto uma confirmação está pendente, o status exibido permaneça "Waiting for decision..." e não seja sobrescrito pelas atualizações contínuas do spinner da ferramenta, sem o núcleo neutro em relação a provedores participar da confirmação.

operations:
  - op: add
    id: status-hold-during-confirmation
    title: Trava de status durante a confirmação
    statement: O terminal interativo DEVE permitir fixar um status enquanto uma confirmação está pendente, ignorando as atualizações concorrentes do spinner, e liberar a trava ao concluir, restaurando o fluxo normal do status.
    verify: npm test
    scenarios:
      - when: um status é fixado e o spinner tenta atualizar o status em seguida
        then: o status exibido permanece o texto fixado e a atualização do spinner é ignorada
      - when: a trava de status é liberada
        then: as atualizações de status voltam a ter efeito

  - op: add
    id: stable-waiting-status-with-spinner
    title: Status de espera estável com o spinner ativo
    statement: O sistema DEVE exibir "Waiting for decision..." de forma estável enquanto a confirmação de escrita está pendente, mesmo com o spinner da ferramenta ativo emitindo "Writing...", liberando o status ao concluir a decisão.
    verify: npm test
    scenarios:
      - when: o spinner está ativo com "Writing..." e uma confirmação de escrita é aberta
        then: o status passa a "Waiting for decision..." e permanece assim apesar dos ticks do spinner
      - when: a decisão é tomada
        then: a trava é liberada e o status volta ao fluxo normal
