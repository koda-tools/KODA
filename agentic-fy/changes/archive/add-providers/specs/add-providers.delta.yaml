# Spec delta for the "add-providers" capability.
capability: add-providers
purpose: Make every provider a catalog entry instead of code, so connecting and using an OpenAI-compatible vendor needs no new module.

operations:
  - op: add
    id: catalog-open-registry
    title: The provider catalog is an open registry
    statement: Provider identity SHALL be defined by the catalog rather than by a closed type union, validated at every boundary against the catalog, so adding a provider is a catalog entry and requires no change to the factory, the configuration types or the connect flow.
    verify: cd packages/core && node --conditions=development --test --import tsx test/factory.test.ts test/provider-registry.test.ts
    scenarios:
      - when: a provider entry is added to the catalog
        then: it is accepted by the environment selector, the factory and the agent model prefix with no other source change
      - when: a name absent from the catalog is used
        then: it is rejected with an unsupported-provider error

  - op: add
    id: factory-dispatch-by-sdk
    title: The factory dispatches by SDK kind
    statement: The factory SHALL build every provider from its catalog entry by dispatching on the entry's SDK kind, and the provider layer SHALL NOT branch on individual provider names in the factory, config or catalog modules.
    verify: cd packages/core && node --conditions=development --test --import tsx test/provider-registry.test.ts
    scenarios:
      - when: the factory creates any catalog provider
        then: one code path serves them all and the base URL is validated whenever one is configured
      - when: the provider layer is scanned
        then: no conditional keyed on a provider name remains in the catalog, config or factory modules

  - op: add
    id: openai-compatible-vendors
    title: OpenAI-compatible vendors come from the catalog
    statement: The catalog SHALL include the OpenAI-compatible hosted and local vendors, each with its base URL, API key variable, model variable and default model, served by the shared AI SDK adapter without a dedicated package or module.
    verify: cd packages/core && node --conditions=development --test --import tsx test/provider-wire.test.ts
    scenarios:
      - when: a catalog-only OpenAI-compatible provider sends a request
        then: the request reaches its configured base URL and the response is normalized like the built-in providers
      - when: that provider streams a tool call
        then: the normalized events match the OpenAI-shaped behavior

  - op: add
    id: connect-lists-every-provider
    title: Connect lists every provider that needs a key
    statement: The connect flow SHALL offer every catalog provider that requires an API key, with its connection status, SHALL exclude local providers that need no key, and SHALL save the key under the variable declared by the catalog entry.
    verify: cd packages/koda && node --conditions=development --test --import tsx test/connect-flow.test.ts
    scenarios:
      - when: the connect selector is opened
        then: it lists every provider that requires a key and no local provider
      - when: a provider is chosen and a key entered
        then: the key is stored under that provider's declared variable and never echoed

# Deferred: `searchable-choice-list` (typeahead filter on the ChoiceList).
# The open registry and the ~17 new providers landed without it. With ~15
# key-needing providers the connect list is navigable but not yet
# filterable; the filter is a TUI-widget change worth its own change with
# its own layout test. Removed from this delta rather than shipped unverified.
