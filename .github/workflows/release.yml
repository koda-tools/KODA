name: Release

# Publishes to npm ONLY when a GitHub Release is published.
# Trunk-based flow:
#   1. Work merges into `main` (validated by CI).
#   2. Bump the version in packages/core/package.json and packages/koda/package.json
#      (and the @koda-tools/core dependency in koda) on main and push.
#   3. Create a GitHub Release with tag `vX.Y.Z` → this workflow publishes it.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # enables npm provenance (--provenance) on supported registries

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish # optional: gate behind a protected environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (registry configured for publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the release tag matches both packages
        # Guards against publishing a version that doesn't match the tag, and a
        # CLI that depends on a core version other than the one being published.
        # Accepts tags like "v1.2.3" or "1.2.3".
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          KODA_VERSION="$(node -p "require('./packages/koda/package.json').version")"
          KODA_CORE_DEP="$(node -p "require('./packages/koda/package.json').dependencies['@koda-tools/core']")"
          echo "packages/core/package.json: $CORE_VERSION | packages/koda/package.json: $KODA_VERSION | koda depends on core: $KODA_CORE_DEP | release tag: $TAG"
          for found in "$CORE_VERSION" "$KODA_VERSION" "$KODA_CORE_DEP"; do
            if [ "$found" != "$TAG" ]; then
              echo "::error::Release tag ($TAG) does not match packages/core/package.json ($CORE_VERSION), packages/koda/package.json ($KODA_VERSION) or the core version koda depends on ($KODA_CORE_DEP)."
              echo "Bump both packages and the dependency to $TAG (or tag the release vX.Y.Z to match) and recreate the release."
              exit 1
            fi
          done

      - name: Publish @koda-tools/core
        # Core first, so the version koda depends on exists when koda is installed.
        run: npm publish -w @koda-tools/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @koda-tools/koda
        run: npm publish -w @koda-tools/koda --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
